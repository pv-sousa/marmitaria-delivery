<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marmitaria da Verinha</title>

    <style>

        /* =========================
           CORES DO SITE
        ========================== */

        :root {
            --laranja: #f26a21;
            --laranja-escuro: #d95712;
            --fundo: #fff8f3;
            --branco: #ffffff;
            --texto: #333333;
            --cinza: #777777;
        }


        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--fundo);
            color: var(--texto);
        }


        /* =========================
           CABEÇALHO
        ========================== */

        header {
            background: var(--branco);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }

        header h1 {
            color: var(--laranja);
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--cinza);
        }


        /* =========================
           CONTEÚDO
        ========================== */

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .titulo {
            margin-bottom: 20px;
            color: var(--texto);
        }


        /* =========================
           CARDÁPIO
        ========================== */

        .cardapio {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 20px;
        }

        .produto {
            background: var(--branco);
            border-radius: 15px;
            padding: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .produto h3 {
            margin-bottom: 10px;
        }

        .produto p {
            color: var(--cinza);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .preco {
            color: var(--laranja);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }


        /* =========================
           BOTÃO
        ========================== */

        .botao {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: var(--laranja);
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .botao:hover {
            background: var(--laranja-escuro);
        }


        /* =========================
           RODAPÉ
        ========================== */

        footer {
            margin-top: 40px;
            padding: 25px;

            text-align: center;

            background: var(--laranja);
            color: white;
        }

    </style>

</head>


<body>


    <!-- CABEÇALHO -->

    <header>

        <h1>
            🍱 Marmitaria da Verinha
        </h1>

        <p>
            Comida caseira feita com carinho!
        </p>

    </header>


    <!-- CONTEÚDO -->

    <main class="container">

        <h2 class="titulo">
            🍽️ Cardápio
        </h2>


        <div class="cardapio">


            <!-- PRODUTO 1 -->

            <div class="produto">

                <h3>
                    Marmita 1 Carne
                </h3>

                <p>
                    Arroz, feijão, salada e uma opção de carne.
                </p>

                <div class="preco">
                    R$ 15,00
                </div>

                <button
                    class="botao"
                    onclick="fazerPedido('Marmita 1 Carne')">

                    Pedir pelo WhatsApp

                </button>

            </div>


            <!-- PRODUTO 2 -->

            <div class="produto">

                <h3>
                    Marmita 2 Carnes
                </h3>

                <p>
                    Arroz, feijão, salada e duas opções de carne.
                </p>

                <div class="preco">
                    R$ 18,00
                </div>

                <button
                    class="botao"
                    onclick="fazerPedido('Marmita 2 Carnes')">

                    Pedir pelo WhatsApp

                </button>

            </div>


        </div>

    </main>


    <!-- RODAPÉ -->

    <footer>

        Marmitaria da Verinha © 2026

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        function fazerPedido(produto) {

            const telefone = "5588999999999";

            const mensagem =
                "Olá! Gostaria de fazer um pedido.%0A%0A" +
                "Produto: " + produto;

            const whatsapp =
                "https://wa.me/" +
                telefone +
                "?text=" +
                mensagem;

            window.open(
                whatsapp,
                "_blank"
            );

        }

    </script>


</body>

</html>
